name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repo-grounded review: findings are tied to THIS project's real gates,
          # not a generic checklist. See docs/INFRASTRUCTURE.md and CLAUDE.md.
          prompt: |
            Review this pull request's diff for the SVG Splitter repo.
            Priorities in order:
            1. ES3 / ExtendScript compliance in src/ (no const/let/arrow/class/for-of,
               no ES5+ array/string/object methods, no for-in). eslint.config.js
               (ecmaVersion: 3) is the gate.
            2. src/ -> dist/ build sync — dist/*.jsx is generated by build.js and must be
               rebuilt and committed with any src/ change; it is never hand-edited.
            3. SVG -> AE conversion correctness (transform/anchor math, path parsing,
               fill rules & holes, gradients, Figma frame-wrapper unwrapping).
            Post findings as inline review comments grouped Blocker / Should-fix / Nit.
            Do not approve or block the PR; a human makes that call.
          claude_args: "--max-turns 15"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

